name: customer_web
description: Customer-facing ordering website (Flutter web) for the franchise platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Shared domain (models, FranchiseProvider, FirestoreService, Order, branding)
  shared_core:
    path: ../packages/shared_core

  # State + routing
  provider: ^6.1.2
  go_router: ^16.0.0

  # Firebase (same project as mobile / pos / web-app)
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  cloud_functions: ^5.5.0

  # Payments (web-capable path; used from Phase 7)
  flutter_stripe: ^11.4.0
  flutter_stripe_web: ^6.5.0
  

  # Utilities already used across the monorepo
  intl: any
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  uuid: ^4.0.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true