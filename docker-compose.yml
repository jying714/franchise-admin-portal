version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=6              # higher concurrency for multiple agents
      - OLLAMA_MAX_LOADED_MODELS=4         # keep more models warm (Orchestrator always running)
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Dedicated machine → give Ollama most of the RAM
    mem_limit: 56g
    mem_reservation: 12g

volumes:
  ollama_data: