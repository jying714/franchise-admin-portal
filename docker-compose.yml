services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=6
      - OLLAMA_MAX_LOADED_MODELS=4
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Tuned for host .wslconfig memory=40GB (leaves headroom for Windows + orchestrator)
    mem_limit: 36g
    mem_reservation: 12g

  orchestrator:
    build: ./orchestrator
    container_name: franchise-orchestrator
    depends_on:
      ollama:
        condition: service_healthy
    working_dir: /app/orchestrator
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PROJECT_ROOT=/app
      - PYTHONUNBUFFERED=1
      # Optional model overrides (uncomment & change if desired)
      # - MODEL_ORCHESTRATOR=qwen2.5-coder:7b
      # - MODEL_BACKEND=qwen2.5-coder:14b
      # - MODEL_WEB=qwen2.5-coder:14b
      # - MODEL_MOBILE=qwen2.5-coder:14b
    volumes:
      - .:/app                    # full monorepo — agents can read all docs & code
    restart: unless-stopped
    stdin_open: true
    tty: true
    mem_limit: 4g
    mem_reservation: 1g

volumes:
  ollama_data:
