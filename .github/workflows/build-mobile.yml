# .github/workflows/build-mobile.yml
name: Build Mobile APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-mobile.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Workaround for Node 20 deprecation (Node 22 preferred via setup-node)

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - uses: actions/checkout@v4

      # Explicit Node 22 to address GitHub Actions Node 20 deprecation
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localization
        run: flutter gen-l10n

      - name: Analyze Only (No Full Build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        # Made non-fatal so legacy warnings/infos (e.g. 200+ existing) do not block CI