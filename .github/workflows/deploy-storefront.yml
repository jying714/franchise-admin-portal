# .github/workflows/deploy-storefront.yml
name: Deploy Storefront (customer_web)

on:
  push:
    branches: [ main ]
    paths:
      - 'customer_web/**'
      - 'packages/shared_core/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-storefront.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./customer_web

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
      - run: flutter pub get
      - run: flutter build web --release --dart-define=STRIPE_PK=${{ secrets.STRIPE_PK_TEST }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: doughboyspizzeria-2b3d2
          channelId: live
          target: storefront